<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f0e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1915" media="(prefers-color-scheme: dark)" />
    <title>Folio · 离线</title>
    <style>
      :root { color-scheme: light dark; }
      body { display:grid; min-height:100vh; place-items:center; margin:0; background:#f4f0e7; color:#342f26; font-family:system-ui,sans-serif; }
      main { max-width:280px; padding:32px; text-align:center; }
      h1 { font-family:Georgia,serif; font-weight:500; }
      p { color:#81796b; line-height:1.65; text-wrap:pretty; }
      @media (prefers-color-scheme: dark) {
        body { background:#1b1915; color:#ece6da; }
        p { color:#9d9586; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="h">Folio</h1>
      <p id="msg">第一次打开需要联网。连接网络后再试一次，之后便可以离线记录。</p>
    </main>
    <script>
      if (!/^zh/i.test(navigator.language || "")) {
        document.documentElement.lang = "en";
        document.title = "Folio · Offline";
        document.getElementById("msg").textContent = "Folio needs a connection the first time you open it. Connect and try again, and you can capture notes offline from then on.";
      }
    </script>
  </body>
</html>
